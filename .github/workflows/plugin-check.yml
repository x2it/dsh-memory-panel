name: plugin-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone dsh-plugin-check (pinned)
        run: |
          git clone --depth 1 https://github.com/omdsh-dev/dsh-plugin-check /tmp/dsh-plugin-check

      - name: Install checker dependencies
        working-directory: /tmp/dsh-plugin-check
        run: npm install --no-audit --no-fund

      - name: Run plugin_check
        # The checker's lib imports @deepseek-ai/dsh-tools; resolve it from the
        # checker's own node_modules by importing through its real location.
        run: |
          node --input-type=module -e "
            import { checkRepo } from 'file:///tmp/dsh-plugin-check/lib/index.js';
            const report = await checkRepo(process.cwd(), true, async () => ({ status: 'skipped', issues: [] }));
            console.log(JSON.stringify(report, null, 2));
            if (report.verdict !== 'pass' || report.errors.length > 0) process.exit(1);
          "
