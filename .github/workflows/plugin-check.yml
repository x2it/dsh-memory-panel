name: plugin-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install OUR devDependencies (includes @deepseek-ai/dsh-tools, cordis).
      # The checker only imports @deepseek-ai/dsh-tools at runtime, so resolving
      # it from our own node_modules avoids the checker's broken package-lock.
      - name: Install our dependencies
        run: npm install --no-audit --no-fund

      - name: Clone dsh-plugin-check (pinned)
        run: |
          mkdir -p node_modules/@deepseek-ai
          git clone --depth 1 https://github.com/omdsh-dev/dsh-plugin-check node_modules/@deepseek-ai/dsh-plugin-check

      - name: Run plugin_check
        run: |
          node --input-type=module -e "
            import { checkRepo } from './node_modules/@deepseek-ai/dsh-plugin-check/lib/index.js';
            const report = await checkRepo(process.cwd(), true, async () => ({ status: 'skipped', issues: [] }));
            console.log(JSON.stringify(report, null, 2));
            if (report.verdict !== 'pass' || report.errors.length > 0) process.exit(1);
          "
